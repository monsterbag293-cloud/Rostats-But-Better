<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoStats User Lookup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>RoStats User Lookup</h1>
        <p>Find Roblox account info quickly with roproxy endpoints.</p>
      </header>

      <section class="search-card">
        <form id="player-form" autocomplete="off">
          <label for="username">Roblox Username</label>
          <div class="input-row">
            <input id="username" name="username" type="text" placeholder="Enter username..." required />
            <button type="submit">Search</button>
          </div>
        </form>

        <div id="loading" class="loading hidden" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span>Searching...</span>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <section id="profile" class="profile hidden" aria-live="polite">
        <div class="profile-header">
          <img id="avatar" alt="Roblox avatar headshot" />
          <div>
            <h2 id="display-name"></h2>
            <p id="username-handle"></p>
          </div>
        </div>

        <div class="details">
          <article class="detail-card">
            <h3>User ID</h3>
            <p id="user-id">—</p>
          </article>
          <article class="detail-card">
            <h3>Join Date</h3>
            <p id="join-date">—</p>
          </article>
          <article class="detail-card detail-card-wide">
            <h3>Bio</h3>
            <p id="bio">No bio provided.</p>
          </article>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
