<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vigenère Cipher Workbench</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>Vigenère Cipher Workbench</h1>
        <p>High-speed brute force, smarter scoring, and clean analyst-grade output.</p>
      </header>

      <section class="panel">
        <label for="cipher-text">Encrypted text</label>
        <textarea id="cipher-text" rows="7" placeholder="Paste ciphertext here..."></textarea>

        <div class="controls-grid">
          <label>
            Min key length
            <input id="min-key-length" type="number" min="1" max="8" value="1" />
          </label>

          <label>
            Max key length
            <input id="max-key-length" type="number" min="1" max="8" value="3" />
          </label>

          <label>
            Top results
            <input id="top-results" type="number" min="5" max="100" value="15" />
          </label>

          <label>
            Language profile
            <select id="language-profile">
              <option value="english" selected>English</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="solve-btn" type="button">Analyze Cipher</button>
          <button id="clear-btn" type="button" class="ghost">Clear</button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
        <div id="progress-wrap" class="progress-wrap hidden" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </section>

      <section class="panel hidden" id="results-panel" aria-live="polite">
        <div class="results-head">
          <h2>Ranked Candidates</h2>
          <p id="metrics"></p>
        </div>
        <div id="results"></div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
