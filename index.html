<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoStats Live Counter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>RoStats Live Counter</h1>
        <p>Track Roblox profile stats in near real-time.</p>
      </header>

      <section class="search-card">
        <form id="player-form" autocomplete="off">
          <label for="username">Roblox Username</label>
          <div class="input-row">
            <input id="username" name="username" type="text" placeholder="Enter username..." required />
            <button type="submit">Start</button>
          </div>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <section id="profile" class="profile hidden" aria-live="polite">
        <div class="profile-header">
          <img id="avatar" alt="Roblox avatar" />
          <div>
            <h2 id="display-name"></h2>
            <p id="meta"></p>
          </div>
        </div>

        <div class="grid">
          <article class="stat-card">
            <h3>Followers</h3>
            <p id="followers" class="number">—</p>
          </article>
          <article class="stat-card">
            <h3>Following</h3>
            <p id="following" class="number">—</p>
          </article>
          <article class="stat-card">
            <h3>Friends</h3>
            <p id="friends" class="number">—</p>
          </article>
          <article class="stat-card">
            <h3>Total Visits</h3>
            <p id="visits" class="number">—</p>
          </article>
          <article class="stat-card">
            <h3>Active Games</h3>
            <p id="games" class="number">—</p>
          </article>
          <article class="stat-card">
            <h3>Estimated Revenue</h3>
            <p id="revenue" class="number">—</p>
          </article>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
